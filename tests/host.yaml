# Host test (run.sh): ESPHome on the `host` platform, UART on a pty to
# fake_mcu.py. Checks for and installs the bundled firmware 3 s after boot.
substitutions:
  name: tuya-mcu-dfu-test

esphome:
  name: ${name}
  on_boot:
    priority: -100
    then:
      - delay: 3s
      - update.check: mcu_firmware
      - if:
          condition:
            update.is_available: mcu_firmware
          then:
            - logger.log: "TEST: update available, starting"
            - update.perform: mcu_firmware
          else:
            - logger.log: "TEST: no update available"

external_components:
  - source:
      type: local
      path: ../components
    components: [tuya_mcu_dfu]

host:

logger:
  level: DEBUG

uart:
  id: mcu_uart
  port: /tmp/tuya-mcu-dfu-esp
  baud_rate: 115200

tuya:
  id: mcu
  uart_id: mcu_uart

update:
  - platform: tuya_mcu_dfu
    id: mcu_firmware
    name: MCU firmware
    uart_id: mcu_uart
    source: build/manifest.json
    required: true
    version_datapoint: 120
